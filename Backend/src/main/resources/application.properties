spring.application.name=levelup-backend

# --- Datasource (PostgreSQL) - configurar por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/levelup}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# Sin valor por defecto: la app NO arranca si JWT_SECRET falta o tiene menos de 32 caracteres
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Admin inicial (seed). En producción definir ADMIN_EMAIL y ADMIN_PASSWORD ---
app.admin.email=${ADMIN_EMAIL:admin@levelup.cl}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# --- CORS (origen del front, separado por comas si hay varios) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
